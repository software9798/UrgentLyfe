version: '3.8'

services:
  urgentlyfe-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urgentlyfe_marketplace
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-MY_GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-urgentlyfe_secure_jwt_secret_key_2026}
      - APP_URL=${APP_URL:-http://localhost:3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
